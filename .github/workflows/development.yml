name: Development

on: push

jobs:
  test:
    name: Test whether CVTemplate, all themes and all subfiles compile
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/typst/typst:latest
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v7

      - name: "test utils"
        run: typst compile content/utils.typ --root .

      - name: "test modern theme (default, from config)"
        run: typst compile test/CVTemplateTest.typ --root . --font-path fonts

      - name: "test classic theme (German)"
        run: typst compile test/CVTemplateTestClassic.typ --root . --font-path fonts

      - name: "test terminal theme"
        run: typst compile test/CVTemplateTestTerminal.typ --root . --font-path fonts

      - name: "test legacy data format in every theme"
        run: typst compile test/CVTemplateTestLegacy.typ --root . --font-path fonts
